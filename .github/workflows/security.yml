name: security

on: [push, pull_request]

permissions:
 contents: read

jobs:
 gitleaks:
  name: Secrets scan (gitleaks)
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
    with:
     fetch-depth: 0

   - name: Install gitleaks
    run: |
     curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
      | tar xz -C /usr/local/bin gitleaks

   - name: Run gitleaks
    run: gitleaks detect --source . --config .gitleaks.toml --verbose 2>&1
