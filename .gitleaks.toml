# Gitleaks configuration — OpenClaw
# Détection de secrets dans le code versionné

title = "OpenClaw gitleaks config"

# Allowlist: patterns connus qui ne sont PAS des secrets
[allowlist]
description = "Faux positifs connus"
regexes = [
  # Exemples dans la doc — valeurs factices
  "TELEGRAM_BOT_TOKEN=.*BotFather",
  "NOTION_TOKEN=.*secret_xxxx",
  "ghp_xxx",
  # Hash de validation — valeurs de test
  "deadbeef",
  # Variables d'environnement dans les exemples
  '\${\w+}',
]
